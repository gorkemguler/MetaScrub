name: MetaScrub
description: Fail the build if tracked PDF/Office/image/SVG files carry metadata, or scrub them.
branding:
  icon: eye-off
  color: green

inputs:
  paths:
    description: Space-separated files or directories to check.
    required: false
    default: "."
  mode:
    description: '"check" (fail on metadata, default) or "fix" (scrub in place).'
    required: false
    default: check
  args:
    description: Extra flags passed to `metascrub clean` (e.g. --strip-office-authors).
    required: false
    default: ""
  version:
    description: MetaScrub version spec for pip (e.g. "==0.2.0").
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        python -m pip install --quiet "metascrub${{ inputs.version }}"
        if [ "${{ inputs.mode }}" = "fix" ]; then
          metascrub clean ${{ inputs.paths }} --in-place --yes \
            --no-json-report --no-html-report ${{ inputs.args }}
        else
          metascrub clean ${{ inputs.paths }} --check \
            --no-json-report --no-html-report ${{ inputs.args }}
        fi
