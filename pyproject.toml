[project]
name = "metacls"
version = "0.3.1"
description = "Bulk metadata scrubbing for PDF/Office/image files — the remediation companion to MetaScout."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Görkem Güler" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "pikepdf>=9.0",
    "olefile>=0.47",
    "rich>=13.7",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "flask>=3.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Opt-in REST API service (`metacls api`): a separate, job-based HTTP
# service (FastAPI + uvicorn) wrapping the same scan -> clean -> verify
# pipeline as the CLI and local web UI, for programmatic/enterprise
# integration — POST files, poll the job, pull the cleaned files + report
# as a zip. Kept out of the core install: most users only need the CLI or
# the local single-user web UI, not a network-facing service. No built-in
# authentication (see api/app.py and the README) — put a reverse proxy in
# front before exposing it.
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

# Opt-in Pillow fallback for the image engine: only used when the
# `exiftool` binary isn't on PATH. exiftool is the real requirement (it
# strips EXIF/IPTC/XMP/GPS/MakerNotes across every format); Pillow can only
# re-save jpg/png without their metadata blocks and is a strictly weaker
# last resort.
image-fallback = [
    "Pillow>=10.0",
    "pillow-heif>=0.16",
]

# Opt-in audio scrubbing (mp3/flac/ogg/opus/wav/aiff tags via mutagen).
# Video containers (mp4/mov/m4v) use the exiftool binary instead;
# .mkv/.webm/.avi are handled by a pure-Python EBML/RIFF scrubber.
media = [
    "mutagen>=1.47",
]

# Opt-in `.7z` recursion (`metacls clean --recurse` into a 7-Zip
# archive). `.zip` / `.eml` / `.tar` need nothing extra.
archive = [
    "py7zr>=0.20",
]

# Opt-in read-only `.msg` (Outlook) inspection — `metacls inspect
# --recurse` lists what's inside; rewriting the CFB is out of scope.
msg = [
    "extract-msg>=0.48",
]

dev = [
    "pytest>=8.0",
    "mutagen>=1.47",
    "py7zr>=0.20",
    "extract-msg>=0.48",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "Pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/gorkemguler/MetaCLS"
Repository = "https://github.com/gorkemguler/MetaCLS"
Changelog = "https://github.com/gorkemguler/MetaCLS/blob/main/CHANGELOG.md"
Issues = "https://github.com/gorkemguler/MetaCLS/issues"

[project.scripts]
metacls = "metacls.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metacls = ["report/templates/*.jinja", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs an external tool (LibreOffice) and takes a few seconds — deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
# E501: long lines are almost all i18n sentences and OOXML content-type
# URLs — not worth wrapping without an autoformatter. B008: click puts
# function calls in option defaults on purpose.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
exclude = ["tests/"]
