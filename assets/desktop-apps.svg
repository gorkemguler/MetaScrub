<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 480" role="img"
     aria-label="Illustration of the MetaCLS native drop apps for macOS, Windows and Linux">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4a7" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2dd4a7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1320" height="480" fill="#0c1110"/>

  <!-- ===== macOS panel ===== -->
  <g font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif">
    <text x="40" y="34" font-size="16" font-weight="700" fill="#e9efed">macOS</text>
    <text x="106" y="34" font-size="13" fill="#6f8480">· MetaCLS.app (drag-and-drop)</text>

    <rect x="40" y="56" width="400" height="380" rx="14" fill="#12201c" fill-opacity="0.55"/>
    <rect x="40" y="56" width="400" height="380" rx="14" fill="url(#glow)"/>
    <rect x="40.5" y="56.5" width="399" height="379" rx="13.5" fill="none" stroke="#22332e"/>

    <rect x="40" y="56" width="400" height="34" rx="14" fill="#182722"/>
    <rect x="40" y="76" width="400" height="14" fill="#182722"/>
    <circle cx="62" cy="73" r="6.5" fill="#ff5f57"/>
    <circle cx="82" cy="73" r="6.5" fill="#febc2e"/>
    <circle cx="102" cy="73" r="6.5" fill="#28c840"/>
    <text x="240" y="77" font-size="13" fill="#93a5a0" text-anchor="middle">MetaCLS</text>

    <rect x="70" y="120" width="340" height="200" rx="14" fill="none"
          stroke="#2dd4a7" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="8 7"/>
    <g stroke="#2dd4a7" stroke-linecap="round" opacity="0.85">
      <path d="M175 178 H235" stroke-width="7"/>
      <path d="M175 194 H222" stroke-width="7" opacity="0.6"/>
      <path d="M175 210 H205" stroke-width="7" opacity="0.35"/>
    </g>
    <rect x="245" y="160" width="44" height="58" rx="4" fill="#0c1110" stroke="#34d399" stroke-width="2"/>
    <path d="M275 160 L289 174 H275 Z" fill="#34d399"/>
    <text x="240" y="252" font-size="14" fill="#c4d4d0" text-anchor="middle">Drag files to scrub</text>
    <text x="240" y="392" font-size="12" fill="#6f8480" text-anchor="middle">Finder → right-click → Quick Actions → Clean metadata</text>
  </g>

  <!-- ===== Windows panel ===== -->
  <g font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif">
    <text x="460" y="34" font-size="16" font-weight="700" fill="#e9efed">Windows</text>
    <text x="558" y="34" font-size="13" fill="#6f8480">· MetaCLS-drop.ps1 (drop window)</text>

    <rect x="460" y="56" width="400" height="380" rx="4" fill="#12201c" fill-opacity="0.55"/>
    <rect x="460" y="56" width="400" height="380" rx="4" fill="url(#glow)"/>
    <rect x="460.5" y="56.5" width="399" height="379" rx="3.5" fill="none" stroke="#22332e"/>

    <rect x="460" y="56" width="400" height="34" fill="#182722"/>
    <rect x="472" y="66" width="14" height="14" rx="3" fill="url(#ink)"/>
    <text x="494" y="77" font-size="13" fill="#93a5a0">MetaCLS — drop to scrub</text>
    <g stroke="#93a5a0" stroke-width="1.4" stroke-linecap="round">
      <path d="M792 73 H802"/>
      <rect x="820" y="67" width="10" height="10" fill="none" stroke="#93a5a0" stroke-width="1.4"/>
      <path d="M850 67 L860 79 M860 67 L850 79"/>
    </g>

    <rect x="490" y="120" width="340" height="200" rx="4" fill="none"
          stroke="#2dd4a7" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="8 7"/>
    <g stroke="#2dd4a7" stroke-linecap="round" opacity="0.85">
      <path d="M595 178 H655" stroke-width="7"/>
      <path d="M595 194 H642" stroke-width="7" opacity="0.6"/>
      <path d="M595 210 H625" stroke-width="7" opacity="0.35"/>
    </g>
    <rect x="665" y="160" width="44" height="58" rx="4" fill="#0c1110" stroke="#34d399" stroke-width="2"/>
    <path d="M695 160 L709 174 H695 Z" fill="#34d399"/>
    <text x="660" y="252" font-size="14" fill="#c4d4d0" text-anchor="middle">Drop files to scrub</text>
    <text x="660" y="392" font-size="12" fill="#6f8480" text-anchor="middle">Explorer → right-click → Send to / Clean metadata</text>
  </g>

  <!-- ===== Linux panel ===== -->
  <g font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif">
    <text x="880" y="34" font-size="16" font-weight="700" fill="#e9efed">Linux</text>
    <text x="944" y="34" font-size="13" fill="#6f8480">· metacls-drop.desktop (launcher)</text>

    <rect x="880" y="56" width="400" height="380" rx="10" fill="#12201c" fill-opacity="0.55"/>
    <rect x="880" y="56" width="400" height="380" rx="10" fill="url(#glow)"/>
    <rect x="880.5" y="56.5" width="399" height="379" rx="9.5" fill="none" stroke="#22332e"/>

    <rect x="880" y="56" width="400" height="34" rx="10" fill="#182722"/>
    <rect x="880" y="76" width="400" height="14" fill="#182722"/>
    <g stroke="#93a5a0" stroke-width="1.6" stroke-linecap="round">
      <path d="M902 68 H916"/>
      <path d="M902 73 H916"/>
      <path d="M902 78 H916"/>
    </g>
    <text x="1080" y="77" font-size="13" fill="#93a5a0" text-anchor="middle">MetaCLS</text>
    <circle cx="1250" cy="73" r="9" fill="none" stroke="#93a5a0" stroke-width="1.4"/>
    <path d="M1246 69 L1254 77 M1254 69 L1246 77" stroke="#93a5a0" stroke-width="1.4"/>

    <rect x="910" y="120" width="340" height="200" rx="10" fill="none"
          stroke="#2dd4a7" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="8 7"/>
    <g stroke="#2dd4a7" stroke-linecap="round" opacity="0.85">
      <path d="M1015 178 H1075" stroke-width="7"/>
      <path d="M1015 194 H1062" stroke-width="7" opacity="0.6"/>
      <path d="M1015 210 H1045" stroke-width="7" opacity="0.35"/>
    </g>
    <rect x="1085" y="160" width="44" height="58" rx="4" fill="#0c1110" stroke="#34d399" stroke-width="2"/>
    <path d="M1115 160 L1129 174 H1115 Z" fill="#34d399"/>
    <text x="1080" y="252" font-size="14" fill="#c4d4d0" text-anchor="middle">Open with / drop to scrub</text>
    <text x="1080" y="392" font-size="12" fill="#6f8480" text-anchor="middle">Files → right-click → Scripts → Clean metadata</text>
  </g>

  <text x="660" y="462" font-size="12" font-style="italic" fill="#576b66" text-anchor="middle">
    Illustration of the native drop apps — not a live screenshot. See platform/ for the actual install scripts.
  </text>
</svg>
