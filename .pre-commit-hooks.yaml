- id: metacls
  name: metacls (no metadata in committed files)
  description: Fail the commit if a staged PDF/Office/image/SVG still carries metadata.
  entry: metacls clean --check --no-json-report --no-html-report
  language: python
  pass_filenames: true
  types_or: [pdf, file]
  files: '\.(pdf|docx|xlsx|pptx|odt|ods|odp|doc|xls|ppt|svg|jpe?g|png|tiff?|heic|webp)$'
