ShortDescription: Bulk metadata scrubbing for PDF, Office, image, audio and video files.
Description: |-
  MetaCLS strips identifying metadata (author, software, GPS, internal
  paths, timestamps) from PDF, Office, OpenDocument, image, SVG, audio and
  video files in bulk, verifies each cleaned file, and produces a
  before/after report. CLI, a local web UI and a job-based REST API.
