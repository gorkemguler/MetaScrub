name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" ruff mypy
      - run: ruff check src tests
      - run: mypy src
      - run: metascrub --version   # smoke-test the console entry point

  test:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install exiftool (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - name: Install exiftool (macOS)
        if: runner.os == 'macOS'
        run: brew install exiftool
      - name: Install exiftool (Windows)
        if: runner.os == 'Windows'
        run: choco install exiftool -y

      - run: pip install -e ".[dev]"

      # Fast suite everywhere (no LibreOffice needed).
      - run: pytest -q -m "not slow"

      # Full suite (incl. the LibreOffice fallback + real mkv/avi via
      # ffmpeg) on one Linux job.
      - name: LibreOffice + ffmpeg + full suite
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: |
          sudo apt-get install -y libreoffice-core libreoffice-writer ffmpeg
          pytest -q
